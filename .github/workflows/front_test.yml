name: Front Test

on:
  push:
    branches: [ main ]
    paths:
      - "front/**"
  pull_request:
    branches: [ main ]
    paths:
      - "front/**"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: front

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Biome (Lint & Format)
        run: npm run lint
